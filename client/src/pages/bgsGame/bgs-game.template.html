<dialog class="joiningDialog" id="joining">
  <h2>Joining Game...</h2>
  <p id="joiningDialogPhase"></p>
  <ul id="joinedPlayersList" aria-label="Players in the lobby"></ul>
  <progress></progress>
  <button id="startGameButton" hidden disabled>Start</button>
  <button id="cancelJoiningButton">Cancel Joining</button>
</dialog>
